# CCE Remote: static files, the single-page fallback, caching and security headers.
# A template: at start the nginx image fills in the CCE_REMOTE_TAILNET variable (see the Dockerfile)
# and writes the result to /etc/nginx/conf.d/default.conf, inside the http block of its nginx.conf.

# Hashed build files never change; everything else is checked on every load. Errors are never stored: a
# build file that is missing for a moment during a deploy (an old page asking for the new build's files, or
# the other way round) must not stick as a 404. Regexes are tried in order.
map "$status $uri" $cce_cache_control {
    default                        "no-store";
    "~^(200|206|304) /assets/"     "public, max-age=31536000, immutable";
    "~^(200|206|304) /icons/"      "public, max-age=86400";
    "~^(200|206|304) "             "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # On every response, errors included. No location below adds headers of its own: in nginx that would
    # silently drop these. connect-src: the Macs, at https://<machine>.<tailnet>.ts.net:<port>.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://*.${CCE_REMOTE_TAILNET}:* https://*.${CCE_REMOTE_TAILNET}:*; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self)" always;
    add_header Cache-Control $cce_cache_control always;

    # The app handles its own screens: unknown paths get the app page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A missing build file or icon is a 404, never the app page (the service worker would cache it as code).
    location /assets/ {
        try_files $uri =404;
    }

    location /icons/ {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    # .webmanifest isn't in nginx's MIME table.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
}
